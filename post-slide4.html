<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officium Supremum — Instagram Slide 04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Oswald:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-primary: #0a1017;
    --ink-secondary: #1e293b;
    --accent-gold: #8c6517;
    --accent-navy: #162a3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080a0c;
    font-family: 'Fraunces', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 10px;
    -webkit-font-smoothing: antialiased;
  }

  .slide-container {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background-color: #8da5b8;
    background-image: url('post_slide4_bg.jpg');
    background-size: cover;
    background-position: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 60px 64px 64px;
  }

  /* Center artwork space: keeps user's original image completely untouched */
  .center-artwork-space {
    flex: 1;
    pointer-events: none;
  }

  /* Bottom Area with User's Email ID & Contact - Pure text, NO boxes */
  .bottom-bar {
    position: relative;
    z-index: 10;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }

  .contact-text-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-primary);
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
  }
  .contact-text-line strong {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 700;
  }
  .contact-text-line span.dot {
    color: var(--accent-gold);
    font-size: 22px;
  }

  .enrollment-note {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #1e293b;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>

<div class="slide-container" id="slide4">
  
  <!-- Artwork space: preserves original "WORDS OF WISDOM" and "TRUST THE PROCESS" untouched -->
  <div class="center-artwork-space"></div>

  <!-- Bottom Bar: Pure text directly on template, NO boxes -->
  <div class="bottom-bar">
    <div class="contact-text-line">
      <span><strong>Email:</strong> osupremum@gmail.com</span>
      <span class="dot">·</span>
      <span><strong>WhatsApp:</strong> +91 8969634656</span>
    </div>
    <div class="enrollment-note">
      Admissions & Mentorship Inquiries · Officium Supremum
    </div>
  </div>

</div>

</body>
</html>
